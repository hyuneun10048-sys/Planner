<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>My Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/1f5d3-fe0f.png" />
</head>
<body>
  <div class="app">
    <!-- 상단 바 -->
    <header class="topbar">
      <div class="brand" id="brand"></div>
      <div class="top-actions">
        <button class="pill-btn" id="todayBtn">오늘</button>
        <button class="round-btn" id="calToggle" title="달력 접기/펼치기"></button>
      </div>
    </header>

    <!-- 월간 달력 -->
    <section class="card cal-card" id="calCard">
      <div class="cal-head">
        <h2 class="cal-title serif" id="calTitle"></h2>
        <div class="cal-nav">
          <button class="round-btn" id="prevMonth" aria-label="이전 달">‹</button>
          <button class="round-btn" id="nextMonth" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </section>

    <!-- 하루 카드 -->
    <section class="card day-card">
      <div class="day-head">
        <button class="arrow" id="prevDay" aria-label="이전 날">‹</button>
        <h1 class="serif day-date" id="dayDate"></h1>
        <button class="arrow" id="nextDay" aria-label="다음 날">›</button>
        <div class="serif day-total" id="dayTotal"></div>
      </div>

      <div class="now-bar hidden" id="nowBar"></div>

      <div class="day-body">
        <!-- 왼쪽: 할 일 -->
        <div class="todo-col">
          <div id="sections"></div>

          <form class="add-section hidden" id="addSectionForm" autocomplete="off">
            <button type="button" class="emoji-pick" id="sectionEmojiBtn"></button>
            <input id="sectionName" placeholder="섹션 이름" maxlength="20" />
            <button type="submit" class="mini-submit">추가</button>
          </form>
          <div class="col-foot">
            <button class="ghost-pill" id="showAddSection">＋ 섹션</button>
            <button class="ghost-pill" id="editToggle">편집</button>
          </div>
        </div>

        <!-- 오른쪽: 10분 단위 타임테이블 -->
        <div class="grid-col">
          <div class="timetable" id="timetable"></div>
        </div>
      </div>

      <details class="logs" id="logsBox">
        <summary id="logsSummary"></summary>
        <ul class="log-list" id="logList"></ul>
      </details>
    </section>

    <p class="hint">섹션 이름을 누르면 시간 기록이 시작되고, 다시 누르면 멈춰요.</p>
  </div>

  <div class="popover hidden" id="emojiPopover"></div>

  <script src="app.js"></script>
</body>
</html>
