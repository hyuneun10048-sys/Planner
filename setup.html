<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>스크립트 코드 복사</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="icon" type="image/png" href="icons/favicon-32.png" />
  <style>
    :root { --ink: #111; --sub: #8a8a8a; --line: #e6e6e6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font-family: "Pretendard", -apple-system, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 20px 60px; }
    h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.03em; margin: 0 0 18px; padding-bottom: 14px; border-bottom: 3px solid var(--ink); }
    label { display: block; font-size: 13px; font-weight: 900; margin: 18px 0 8px; }
    input { width: 100%; height: 48px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 0; font: inherit; font-size: 16px; font-weight: 700; }
    button { width: 100%; height: 54px; margin-top: 12px; border: 0; border-radius: 0; background: var(--ink); color: #fff; font: inherit; font-size: 17px; font-weight: 900; cursor: pointer; }
    #msg { min-height: 20px; margin: 10px 0 0; font-size: 14px; font-weight: 700; }
    ol { padding-left: 20px; line-height: 1.8; font-size: 15px; }
    ol b { font-weight: 900; }
    .step { border-top: 3px solid var(--ink); margin-top: 28px; padding-top: 12px; }
    .step h2 { font-size: 16px; font-weight: 900; margin: 0 0 6px; }
    a { color: var(--ink); font-weight: 800; }
    textarea { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <main>
    <h1>앱스 스크립트 코드 복사</h1>
    <label for="token">비밀번호 (플래너 ☁️ 에 넣은 것)</label>
    <input id="token" inputmode="text" autocomplete="off" placeholder="예: 1234" />
    <button id="copy">📋 코드 복사하기</button>
    <p id="msg"></p>

    <div class="step">
      <h2>붙여넣고 새 버전으로 배포</h2>
      <ol>
        <li><a href="https://script.google.com" target="_blank" rel="noopener">script.google.com</a> 에서 <b>planner</b> 프로젝트 열기</li>
        <li>코드 화면을 길게 눌러 <b>전체 선택</b> → <b>붙여넣기</b> (기존 코드를 통째로 바꿔요)</li>
        <li>💾 <b>저장</b></li>
        <li><b>배포 → 배포 관리 → ✏️ → 버전: 새 버전 → 배포</b> (URL 은 그대로)</li>
        <li>권한 화면이 나오면 <b>고급 → planner(으)로 이동 → 허용</b></li>
        <li>플래너에서 🔄 새로고침</li>
      </ol>
    </div>
  </main>
  <textarea id="buf"></textarea>
  <script>
    const tokenEl = document.getElementById("token");
    try { tokenEl.value = localStorage.getItem("setup.token") || JSON.parse(localStorage.getItem("planner.sync") || "{}").token || ""; } catch (e) {}
    document.getElementById("copy").onclick = async () => {
      const msg = document.getElementById("msg");
      const token = tokenEl.value.trim();
      if (!token) { tokenEl.focus(); msg.textContent = "비밀번호를 먼저 입력해 주세요"; return; }
      try { localStorage.setItem("setup.token", token); } catch (e) {}
      try {
        const res = await fetch("apps-script/Code.gs", { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        const code = (await res.text()).replace(/const TOKEN = '.*?';/, "const TOKEN = '" + token.replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "';");
        try { await navigator.clipboard.writeText(code); }
        catch (e) { const t = document.getElementById("buf"); t.value = code; t.select(); document.execCommand("copy"); }
        msg.textContent = "✓ 복사했어요 (" + code.split("\n").length + "줄). 아래 순서대로 붙여넣어 주세요";
      } catch (e) {
        msg.textContent = "코드를 불러오지 못했어요: " + e.message;
      }
    };
  </script>
</body>
</html>
